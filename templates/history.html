<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History - Expression Tree Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #141e30, #243b55);
      color: #fff;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: rgba(0, 0, 0, 0.6);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 20px #00f7ff;
    }

    h2 {
      text-align: center;
      color: #00f7ff;
      text-shadow: 0 0 10px #00f7ff;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border: 1px solid #00f7ff;
    }

    th {
      background: #00f7ff;
      color: black;
    }

    tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.1);
    }

    .type-evaluation {
      color: #00ff88;
      font-weight: bold;
    }
    .type-prefix {
      color: #ffcc00;
      font-weight: bold;
    }
    .type-postfix {
      color: #ff0077;
      font-weight: bold;
    }

    .btn {
      display: inline-block;
      padding: 10px 15px;
      margin: 10px 0;
      background: #00f7ff;
      color: black;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 0 15px #00f7ff;
      transition: 0.3s;
    }
    .btn:hover {
      background: #ff0077;
      color: white;
      box-shadow: 0 0 20px #ff0077;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📜 Expression History</h2>
    <a href="/" class="btn">⬅ Back to Calculator</a>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Expression</th>
          <th>Result</th>
          <th>Type</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody>
        {% for row in rows %}
        <tr>
          <td>{{ row[0] }}</td>
          <td>{{ row[1] }}</td>
          <td>{{ row[2] }}</td>
          <td class="type-{{ row[4] }}">{{ row[4] }}</td>
          <td>{{ row[3] }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
